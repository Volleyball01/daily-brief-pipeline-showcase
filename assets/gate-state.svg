<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-labelledby="gate-title gate-desc">
  <title id="gate-title">Delivery gate and recovery states</title>
  <desc id="gate-desc">State flow from PENDING through VALIDATOR, SELF-CHECK, SENDABLE, SEND to DELIVERED; transport failure keeps SENDABLE; gate failure goes to BLOCKED with manual review; below, the repair gradient from bounded local repair to full rescue to human review.</desc>
  <rect width="1080" height="700" fill="#FBFAF7"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="42" font-size="12" letter-spacing="2" fill="#6B747A">DELIVERY GATE — CONTENT APPROVAL IS NOT TRANSPORT SUCCESS</text>
  </g>
  <line x1="40" y1="60" x2="1040" y2="60" stroke="#D6D2C9"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <rect x="30" y="110" width="120" height="56" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="90" y="142" text-anchor="middle" font-size="12" fill="#232A2F">PENDING</text>
    <rect x="200" y="110" width="150" height="56" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="275" y="142" text-anchor="middle" font-size="12" fill="#232A2F">VALIDATOR</text>
    <rect x="400" y="110" width="150" height="56" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="475" y="142" text-anchor="middle" font-size="12" fill="#232A2F">SELF-CHECK</text>
    <rect x="600" y="110" width="160" height="56" rx="2" fill="#FAF3E3" stroke="#A97A18"/>
    <text x="680" y="142" text-anchor="middle" font-size="12" fill="#232A2F">SENDABLE</text>
    <circle cx="616" cy="126" r="3" fill="#A97A18"/>
    <rect x="810" y="110" width="110" height="56" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="865" y="142" text-anchor="middle" font-size="12" fill="#232A2F">SEND</text>
    <rect x="960" y="110" width="100" height="56" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="1010" y="142" text-anchor="middle" font-size="12" fill="#232A2F">DELIVERED</text>
    <circle cx="976" cy="126" r="3" fill="#2E7D4F"/>
  </g>
  <defs>
    <marker id="arrow3" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#6B747A"/>
    </marker>
  </defs>
  <g stroke="#6B747A" stroke-width="1.2" marker-end="url(#arrow3)">
    <line x1="150" y1="138" x2="194" y2="138"/>
    <line x1="350" y1="138" x2="394" y2="138"/>
    <line x1="550" y1="138" x2="594" y2="138"/>
    <line x1="760" y1="138" x2="804" y2="138"/>
    <line x1="920" y1="138" x2="954" y2="138"/>
  </g>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <path d="M 865 166 L 865 210 L 680 210 L 680 172" fill="none" stroke="#A97A18" stroke-width="1.2" marker-end="url(#arrow3)"/>
    <text x="772" y="198" text-anchor="middle" font-size="10" fill="#A97A18">transport failure — keep SENDABLE, record error · Recovery may resend</text>
    <rect x="400" y="300" width="260" height="92" rx="2" fill="#FBEDEA" stroke="#B5453B"/>
    <text x="530" y="334" text-anchor="middle" font-size="13" fill="#232A2F">BLOCKED + MANUAL REVIEW</text>
    <text x="530" y="360" text-anchor="middle" font-size="10" fill="#B5453B">manual_review_required = true</text>
    <text x="530" y="376" text-anchor="middle" font-size="10" fill="#6B747A">delivery refuses even if other fields look SENDABLE</text>
    <circle cx="416" cy="318" r="3" fill="#B5453B"/>
  </g>
  <g stroke="#6B747A" stroke-width="1.2" marker-end="url(#arrow3)">
    <line x1="275" y1="166" x2="275" y2="292" stroke-dasharray="4 3"/>
    <line x1="475" y1="166" x2="475" y2="294" stroke-dasharray="4 3"/>
  </g>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="430" font-size="12" letter-spacing="2" fill="#6B747A">REPAIR GRADIENT — BOUNDED, THEN FULL, THEN HUMAN</text>
  </g>
  <line x1="40" y1="448" x2="1040" y2="448" stroke="#D6D2C9"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <rect x="40" y="480" width="300" height="140" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="190" y="512" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 2 — BOUNDED LOCAL REPAIR</text>
    <text x="190" y="540" text-anchor="middle" font-size="10" fill="#6B747A">one pass</text>
    <text x="190" y="556" text-anchor="middle" font-size="10" fill="#6B747A">single-item URL / source / time /</text>
    <text x="190" y="572" text-anchor="middle" font-size="10" fill="#6B747A">supporting fact</text>
    <text x="190" y="588" text-anchor="middle" font-size="10" fill="#6B747A">no new research topics</text>
    <rect x="390" y="480" width="300" height="140" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="540" y="512" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 3 — FULL RESCUE AUTHORITY</text>
    <text x="540" y="540" text-anchor="middle" font-size="10" fill="#6B747A">re-verify · fix / delete / replace /</text>
    <text x="540" y="556" text-anchor="middle" font-size="10" fill="#6B747A">rebuild evidence</text>
    <text x="540" y="572" text-anchor="middle" font-size="10" fill="#6B747A">rewrite unsent brief</text>
    <text x="540" y="588" text-anchor="middle" font-size="10" fill="#6B747A">full gate · at most one corrective pass</text>
    <rect x="740" y="480" width="300" height="140" rx="2" fill="#FBEDEA" stroke="#B5453B"/>
    <text x="890" y="512" text-anchor="middle" font-size="13" fill="#232A2F">BLOCKED + HUMAN REVIEW</text>
    <text x="890" y="540" text-anchor="middle" font-size="10" fill="#6B747A">second full gate failed</text>
    <text x="890" y="556" text-anchor="middle" font-size="10" fill="#6B747A">delivery refused</text>
    <circle cx="756" cy="498" r="3" fill="#B5453B"/>
  </g>
  <g stroke="#6B747A" stroke-width="1.2" marker-end="url(#arrow3)">
    <line x1="340" y1="550" x2="384" y2="550"/>
    <line x1="690" y1="550" x2="734" y2="550"/>
  </g>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="660" font-size="11" fill="#4A5258">Rescue restores full quality rules; it never lowers fact reliability. Semantic color is used sparingly: PASS green · SENDABLE amber · BLOCKED red.</text>
  </g>
</svg>
