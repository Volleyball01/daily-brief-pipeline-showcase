<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">Daily Brief Pipeline architecture</title>
  <desc id="pipe-desc">Stage 1 Collector writes evidence JSON. Stage 2 Writer writes from persisted evidence, performs one bounded repair for local defects, and escalates systemically untrusted evidence to Stage 3 Supervisor. Stage 4 Recovery handles transport failure after SENDABLE only, and never judges evidence trustworthiness.</desc>
  <rect width="1040" height="720" fill="#FBFAF7"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="40" font-size="12" letter-spacing="2" fill="#6B747A">PIPELINE — COLLECT · WRITE &amp; BOUNDED REPAIR · RESCUE · MECHANICAL RECOVERY</text>
  </g>
  <line x1="40" y1="58" x2="1000" y2="58" stroke="#D6D2C9"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <rect x="30" y="110" width="180" height="140" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="120" y="142" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 1 · COLLECTOR</text>
    <text x="120" y="168" text-anchor="middle" font-size="11" fill="#6B747A">open final pages</text>
    <text x="120" y="186" text-anchor="middle" font-size="11" fill="#6B747A">verify claims</text>
    <text x="120" y="204" text-anchor="middle" font-size="11" fill="#6B747A">atomic JSON write</text>
    <text x="120" y="222" text-anchor="middle" font-size="11" fill="#6B747A">weather · news · reading</text>
    <rect x="270" y="86" width="240" height="192" rx="3" fill="none" stroke="#6B747A" stroke-dasharray="5 4"/>
    <text x="390" y="102" text-anchor="middle" font-size="11" letter-spacing="1" fill="#6B747A">EVIDENCE HANDOFF BOUNDARY</text>
    <text x="390" y="118" text-anchor="middle" font-size="11" letter-spacing="1" fill="#6B747A">NO SHARED LONG CONTEXT</text>
    <rect x="290" y="118" width="200" height="140" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="390" y="146" text-anchor="middle" font-size="13" fill="#232A2F">EVIDENCE JSON</text>
    <text x="390" y="174" text-anchor="middle" font-size="12" fill="#6B747A">weather.json</text>
    <text x="390" y="192" text-anchor="middle" font-size="12" fill="#6B747A">news.json</text>
    <text x="390" y="210" text-anchor="middle" font-size="12" fill="#6B747A">deep_reading.json</text>
    <text x="390" y="228" text-anchor="middle" font-size="12" fill="#6B747A">sources.json</text>
    <rect x="570" y="110" width="210" height="140" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="675" y="140" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 2 · WRITER / SENDER</text>
    <text x="675" y="166" text-anchor="middle" font-size="11" fill="#6B747A">writes from persisted evidence</text>
    <text x="675" y="184" text-anchor="middle" font-size="11" fill="#6B747A">local defect → one repair pass</text>
    <text x="675" y="202" text-anchor="middle" font-size="11" fill="#6B747A">systemic untrust → Stage 3</text>
    <text x="675" y="220" text-anchor="middle" font-size="11" fill="#6B747A">validator · self-check · gate</text>
    <rect x="810" y="110" width="200" height="140" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="910" y="142" text-anchor="middle" font-size="13" fill="#232A2F">DELIVERY</text>
    <text x="910" y="166" text-anchor="middle" font-size="11" fill="#6B747A">single guarded entry</text>
    <text x="910" y="184" text-anchor="middle" font-size="11" fill="#6B747A">re-validates before send</text>
    <text x="910" y="202" text-anchor="middle" font-size="11" fill="#6B747A">SENDABLE → send</text>
    <text x="910" y="220" text-anchor="middle" font-size="11" fill="#A97A18">transport fail → Stage 4</text>
    <circle cx="585" cy="268" r="3" fill="#2E7D4F"/>
    <text x="593" y="272" font-size="11" fill="#6B747A">validator PASS · P0/P1 self-check PASS</text>
    <circle cx="865" cy="268" r="3" fill="#A97A18"/>
    <text x="873" y="272" font-size="11" fill="#6B747A">SENDABLE → guarded send</text>
  </g>
  <defs>
    <marker id="arrowP" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#6B747A"/>
    </marker>
  </defs>
  <g stroke="#6B747A" stroke-width="1.2" marker-end="url(#arrowP)">
    <line x1="210" y1="180" x2="264" y2="180"/>
    <line x1="510" y1="180" x2="564" y2="180"/>
    <line x1="780" y1="180" x2="804" y2="180"/>
  </g>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="380" font-size="12" letter-spacing="2" fill="#6B747A">FAILURE PATHS — LOCAL DEFECT · UNTRUSTED EVIDENCE · TRANSPORT FAILURE</text>
  </g>
  <line x1="40" y1="398" x2="1000" y2="398" stroke="#D6D2C9"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <rect x="270" y="430" width="250" height="190" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="395" y="462" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 3 · SUPERVISOR</text>
    <text x="395" y="488" text-anchor="middle" font-size="12" fill="#6B747A">full rescue authority</text>
    <text x="395" y="506" text-anchor="middle" font-size="12" fill="#6B747A">judge success first</text>
    <text x="395" y="524" text-anchor="middle" font-size="12" fill="#6B747A">re-verify · fix · rebuild</text>
    <text x="395" y="542" text-anchor="middle" font-size="12" fill="#6B747A">rewrite unsent brief</text>
    <text x="395" y="560" text-anchor="middle" font-size="12" fill="#6B747A">at most one corrective pass</text>
    <text x="395" y="586" text-anchor="middle" font-size="11" fill="#B5453B">still failing →</text>
    <text x="395" y="604" text-anchor="middle" font-size="11" fill="#B5453B">BLOCKED + HUMAN REVIEW</text>
    <rect x="790" y="430" width="200" height="150" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="890" y="462" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 4 · RECOVERY</text>
    <text x="890" y="488" text-anchor="middle" font-size="12" fill="#6B747A">mechanical only</text>
    <text x="890" y="506" text-anchor="middle" font-size="12" fill="#6B747A">resend if still SENDABLE</text>
    <text x="890" y="524" text-anchor="middle" font-size="12" fill="#6B747A">cleanup on success</text>
    <text x="890" y="552" text-anchor="middle" font-size="11" fill="#6B747A">not an evidence-trust judge</text>
    <text x="400" y="352" font-size="11" fill="#6B747A">systemic / untrusted evidence → Stage 3</text>
    <text x="880" y="310" text-anchor="end" font-size="11" fill="#A97A18">transport failure after SENDABLE</text>
    <text x="880" y="326" text-anchor="end" font-size="11" fill="#A97A18">keep SENDABLE · record error</text>
    <text x="920" y="352" text-anchor="end" font-size="11" fill="#A97A18">resend if still SENDABLE</text>
  </g>
  <g stroke="#6B747A" stroke-width="1.2" marker-end="url(#arrowP)">
    <line x1="390" y1="278" x2="390" y2="424"/>
    <line x1="895" y1="250" x2="895" y2="424"/>
    <line x1="930" y1="430" x2="930" y2="256"/>
  </g>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="694" font-size="11" fill="#4A5258">Stages hand off via the local filesystem; no stage needs another stage's conversation context.</text>
    <text x="40" y="710" font-size="11" fill="#4A5258">Recovery is mechanical and never judges evidence trustworthiness.</text>
  </g>
</svg>
