<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">Daily Brief Pipeline architecture</title>
  <desc id="pipe-desc">Four stages - Collector, Writer/Sender, Supervisor, Recovery - exchanging structured evidence JSON files across an evidence handoff boundary, with a guarded single delivery entry.</desc>
  <rect width="1080" height="640" fill="#FBFAF7"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="42" font-size="12" letter-spacing="2" fill="#6B747A">PIPELINE — FOUR STAGES, ONE EVIDENCE BOUNDARY</text>
  </g>
  <line x1="40" y1="60" x2="1040" y2="60" stroke="#D6D2C9"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="330" y="86" text-anchor="middle" font-size="11" letter-spacing="1" fill="#6B747A">EVIDENCE HANDOFF BOUNDARY — NO SHARED LONG CONTEXT</text>
    <rect x="320" y="98" width="300" height="210" rx="3" fill="none" stroke="#6B747A" stroke-dasharray="5 4"/>
    <rect x="40" y="120" width="200" height="130" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="140" y="152" text-anchor="middle" font-size="13" fill="#232A2F">COLLECTOR</text>
    <text x="140" y="178" text-anchor="middle" font-size="10" fill="#6B747A">open final pages</text>
    <text x="140" y="194" text-anchor="middle" font-size="10" fill="#6B747A">verify claims</text>
    <text x="140" y="210" text-anchor="middle" font-size="10" fill="#6B747A">atomic JSON write</text>
    <rect x="356" y="120" width="228" height="166" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="470" y="148" text-anchor="middle" font-size="12" fill="#232A2F">EVIDENCE JSON</text>
    <text x="470" y="178" text-anchor="middle" font-size="10" fill="#6B747A">weather.json</text>
    <text x="470" y="196" text-anchor="middle" font-size="10" fill="#6B747A">news.json</text>
    <text x="470" y="214" text-anchor="middle" font-size="10" fill="#6B747A">deep_reading.json</text>
    <text x="470" y="232" text-anchor="middle" font-size="10" fill="#6B747A">sources.json</text>
    <rect x="700" y="120" width="200" height="130" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="800" y="152" text-anchor="middle" font-size="13" fill="#232A2F">WRITER / SENDER</text>
    <text x="800" y="178" text-anchor="middle" font-size="10" fill="#6B747A">reads evidence only</text>
    <text x="800" y="194" text-anchor="middle" font-size="10" fill="#6B747A">writes the brief</text>
    <text x="800" y="210" text-anchor="middle" font-size="10" fill="#6B747A">runs the gates</text>
    <circle cx="716" cy="138" r="3" fill="#2E7D4F"/>
    <text x="806" y="282" text-anchor="middle" font-size="10" fill="#6B747A">validator PASS · P0/P1 self-check PASS</text>
    <rect x="940" y="120" width="100" height="130" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="990" y="172" text-anchor="middle" font-size="12" fill="#232A2F">DELIVERY</text>
    <text x="990" y="196" text-anchor="middle" font-size="9" fill="#6B747A">guarded</text>
    <text x="990" y="212" text-anchor="middle" font-size="9" fill="#6B747A">send</text>
    <circle cx="954" cy="138" r="3" fill="#A97A18"/>
    <text x="990" y="282" text-anchor="middle" font-size="10" fill="#6B747A">single entry:</text>
    <text x="990" y="296" text-anchor="middle" font-size="10" fill="#6B747A">send-if-ready</text>
  </g>
  <defs>
    <marker id="arrow2" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#6B747A"/>
    </marker>
  </defs>
  <g stroke="#6B747A" stroke-width="1.2" marker-end="url(#arrow2)">
    <line x1="240" y1="180" x2="314" y2="180"/>
    <line x1="620" y1="180" x2="694" y2="180"/>
    <line x1="900" y1="180" x2="934" y2="180"/>
  </g>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="330" font-size="12" letter-spacing="2" fill="#6B747A">FAILURE PATHS — BOUNDED REPAIR, THEN RESCUE, THEN HUMAN</text>
  </g>
  <line x1="40" y1="348" x2="1040" y2="348" stroke="#D6D2C9"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <rect x="320" y="380" width="320" height="150" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="480" y="412" text-anchor="middle" font-size="13" fill="#232A2F">SUPERVISOR — FULL RESCUE AUTHORITY</text>
    <text x="480" y="438" text-anchor="middle" font-size="10" fill="#6B747A">judge success first</text>
    <text x="480" y="454" text-anchor="middle" font-size="10" fill="#6B747A">re-verify / fix / delete / replace / rebuild evidence</text>
    <text x="480" y="470" text-anchor="middle" font-size="10" fill="#6B747A">rewrite unsent brief · full gate again</text>
    <text x="480" y="486" text-anchor="middle" font-size="10" fill="#6B747A">at most one corrective pass</text>
    <circle cx="336" cy="398" r="3" fill="#B5453B"/>
    <text x="480" y="516" text-anchor="middle" font-size="10" fill="#B5453B">second failure → BLOCKED + human review</text>
    <rect x="720" y="400" width="200" height="110" rx="2" fill="#F1EEE7" stroke="#D6D2C9"/>
    <text x="820" y="430" text-anchor="middle" font-size="13" fill="#232A2F">RECOVERY</text>
    <text x="820" y="454" text-anchor="middle" font-size="10" fill="#6B747A">mechanical · re-validate</text>
    <text x="820" y="470" text-anchor="middle" font-size="10" fill="#6B747A">send only if SENDABLE</text>
    <text x="820" y="486" text-anchor="middle" font-size="10" fill="#6B747A">cleanup on success</text>
  </g>
  <g stroke="#6B747A" stroke-width="1.2" marker-end="url(#arrow2)">
    <line x1="800" y1="250" x2="800" y2="394" stroke-dasharray="4 3"/>
    <line x1="470" y1="286" x2="470" y2="374"/>
    <line x1="760" y1="455" x2="934" y2="455"/>
    <line x1="640" y1="455" x2="714" y2="455"/>
  </g>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="820" y="254" text-anchor="middle" font-size="9" fill="#6B747A">writer failed /</text>
    <text x="820" y="266" text-anchor="middle" font-size="9" fill="#6B747A">evidence untrusted</text>
    <text x="40" y="600" font-size="11" fill="#4A5258">Stages hand off via the local filesystem; no stage needs another stage's conversation context. Scheduled stage times are intentionally not shown.</text>
  </g>
</svg>
