<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">Daily Brief Pipeline architecture</title>
  <desc id="pipe-desc">Collector writes persisted evidence. Writer validates and performs bounded local repair. Systemically untrusted evidence escalates to Supervisor. Transport failure after approval goes to Mechanical Recovery.</desc>
  <rect width="1040" height="650" fill="#FBFAF7"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="40" y="40" font-size="12" letter-spacing="2" fill="#6B747A">PIPELINE — COLLECT · WRITE · RESCUE · RECOVER</text>
  </g>
  <line x1="40" y1="58" x2="1000" y2="58" stroke="#D6D2C9"/>
  <defs>
    <marker id="arrowP" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#737C82"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <rect x="40" y="112" width="190" height="118" rx="2" fill="#F2EFE8" stroke="#D6D2C9"/>
    <text x="135" y="144" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 1 · COLLECTOR</text>
    <text x="135" y="173" text-anchor="middle" font-size="11" fill="#6B747A">open final pages</text>
    <text x="135" y="193" text-anchor="middle" font-size="11" fill="#6B747A">verify claims</text>
    <text x="135" y="213" text-anchor="middle" font-size="11" fill="#6B747A">write evidence</text>

    <text x="400" y="94" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="#6B747A">EVIDENCE HANDOFF</text>
    <line x1="315" y1="102" x2="485" y2="102" stroke="#9AA0A4" stroke-dasharray="5 4"/>
    <rect x="290" y="112" width="220" height="118" rx="2" fill="#F2EFE8" stroke="#D6D2C9"/>
    <text x="400" y="144" text-anchor="middle" font-size="13" fill="#232A2F">EVIDENCE BUNDLE</text>
    <text x="400" y="178" text-anchor="middle" font-size="11" fill="#6B747A">persisted JSON handoff</text>
    <text x="400" y="200" text-anchor="middle" font-size="10.5" fill="#6B747A">weather · news · reading · sources</text>

    <rect x="570" y="112" width="220" height="118" rx="2" fill="#F2EFE8" stroke="#D6D2C9"/>
    <text x="680" y="144" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 2 · WRITER</text>
    <text x="680" y="171" text-anchor="middle" font-size="11" fill="#6B747A">write from evidence</text>
    <text x="680" y="191" text-anchor="middle" font-size="11" fill="#6B747A">one bounded local repair</text>
    <text x="680" y="211" text-anchor="middle" font-size="11" fill="#6B747A">validator · self-check · gate</text>

    <rect x="850" y="112" width="150" height="118" rx="2" fill="#F2EFE8" stroke="#D6D2C9"/>
    <text x="925" y="144" text-anchor="middle" font-size="13" fill="#232A2F">DELIVERY</text>
    <text x="925" y="178" text-anchor="middle" font-size="11" fill="#6B747A">guarded send</text>
    <text x="925" y="198" text-anchor="middle" font-size="11" fill="#6B747A">re-validate first</text>
    <circle cx="865" cy="128" r="3" fill="#A97A18"/>
  </g>

  <g stroke="#737C82" stroke-width="1.15" marker-end="url(#arrowP)">
    <line x1="230" y1="171" x2="284" y2="171"/>
    <line x1="510" y1="171" x2="564" y2="171"/>
    <line x1="790" y1="171" x2="844" y2="171"/>
  </g>

  <text x="40" y="300" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#6B747A">FAILURE PATHS</text>
  <line x1="40" y1="318" x2="1000" y2="318" stroke="#D6D2C9"/>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="420" y="347" font-size="10.5" fill="#6B747A">systemic distrust</text>
    <text x="420" y="365" font-size="10.5" fill="#6B747A">→ Stage 3</text>

    <rect x="315" y="390" width="270" height="132" rx="2" fill="#F2EFE8" stroke="#D6D2C9"/>
    <text x="450" y="422" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 3 · SUPERVISOR</text>
    <text x="450" y="451" text-anchor="middle" font-size="11" fill="#6B747A">full rescue authority</text>
    <text x="450" y="471" text-anchor="middle" font-size="11" fill="#6B747A">re-verify · fix · rebuild</text>
    <text x="450" y="491" text-anchor="middle" font-size="11" fill="#6B747A">rewrite unsent brief</text>
    <text x="450" y="511" text-anchor="middle" font-size="10.5" fill="#B5453B">unsafe → human review</text>

    <text x="760" y="340" font-size="10.5" fill="#A97A18">transport failure</text>
    <text x="760" y="358" font-size="10.5" fill="#A97A18">remain SENDABLE</text>
    <text x="760" y="376" font-size="10.5" fill="#A97A18">Recovery may resend</text>

    <rect x="790" y="410" width="190" height="112" rx="2" fill="#F2EFE8" stroke="#D6D2C9"/>
    <text x="885" y="442" text-anchor="middle" font-size="13" fill="#232A2F">STAGE 4 · RECOVERY</text>
    <text x="885" y="471" text-anchor="middle" font-size="11" fill="#6B747A">mechanical resend only</text>
    <text x="885" y="491" text-anchor="middle" font-size="11" fill="#6B747A">approved content only</text>
    <text x="885" y="511" text-anchor="middle" font-size="10.5" fill="#6B747A">no evidence judgment</text>
  </g>

  <g stroke="#737C82" stroke-width="1.15" marker-end="url(#arrowP)">
    <path d="M400 230 L400 370 L450 370 L450 384" fill="none"/>
    <path d="M925 230 L1000 230 L1000 466 L986 466" fill="none"/>
  </g>

  <text x="40" y="610" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#4A5258">Stages hand off through persisted evidence; Recovery never judges evidence trustworthiness.</text>
</svg>
